name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          # Full git history so Nx can diff HEAD against the base commit.
          fetch-depth: 0

      # Derives NX_BASE and NX_HEAD dynamically from the event:
      #   pull_request -> base = merge target (main), head = PR head
      #   push (main)  -> base = last successful commit, head = current SHA
      - uses: nrwl/nx-set-shas@v4

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # Cache node_modules
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Only the projects affected by this diff (base..head) run each target.
      - run: npx nx record -- npx nx format:check --base=$NX_BASE --head=$NX_HEAD
      - run: npx nx affected -t lint test build typecheck e2e --base=$NX_BASE --head=$NX_HEAD
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
